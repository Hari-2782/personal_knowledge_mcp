
[project]
name = "personal-knowledge-mcp"
version = "0.1.0"
description = "A Python MCP server and Groq-powered AI agent for personal knowledge management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.7.0",
    "mcp[cli]>=2.3.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
[tool.uv.build-backend]
module-name = "knowledge_mcp"